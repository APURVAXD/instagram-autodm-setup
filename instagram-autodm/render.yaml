services:
  - type: web
    name: instagram-autodm
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.7
