<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram AutoDM - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            color: #1a1a1a;
        }
        p {
            color: #666;
            margin-bottom: 32px;
            font-size: 15px;
        }
        .btn-instagram {
            display: inline-block;
            background: linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-instagram:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .features {
            margin-top: 40px;
            text-align: left;
        }
        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: #555;
        }
        .feature::before {
            content: "✓";
            color: #10b981;
            font-weight: bold;
            margin-right: 8px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>📩 Instagram AutoDM</h1>
        <p>Automatically reply to comments and send DMs to grow your business</p>
        
        <a href="{{ url_for('auth_instagram') }}" class="btn-instagram">
            Connect Instagram Account
        </a>
        
        <div class="features">
            <div class="feature">Auto-reply to comments</div>
            <div class="feature">Send personalized DMs</div>
            <div class="feature">Add CTA buttons</div>
            <div class="feature">Multi-account support</div>
            <div class="feature">Track all interactions</div>
        </div>
    </div>
</body>
</html>
